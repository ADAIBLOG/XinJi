name: xinji
description: "薪迹：一款简洁的工资记录应用。"
publish_to: 'none'

version: 1.39.9+4072

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  lucide_icons_flutter: ^3.1.6
  fl_chart: ^1.3.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  file_picker: ^10.0.0
  path_provider: ^2.1.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # 前景图已按安全区留白（63%），不再额外内缩，避免图标过小
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23

flutter:

  uses-material-design: true

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Light.ttf
          weight: 300
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Figtree-Black.ttf
          weight: 900
